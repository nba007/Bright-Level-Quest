name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build game
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PORT=5173 BASE_PATH="/${REPO_NAME}/" pnpm --filter @workspace/bright-3d-adventure run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/bright-3d-adventure/dist/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
